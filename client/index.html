<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7ec850">
<title>Nông Trại Sunnyside 🌾</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- HUD trên -->
<div id="hud" class="hidden">
  <div class="hud-item">💰 <span id="coins">0</span></div>
  <div class="hud-item">📅 Ngày <span id="day">1</span></div>
  <div class="hud-item clock"><div id="clockfill"></div><span id="clockicon">☀️</span></div>
</div>
<button id="muteBtn" class="hidden" title="Bật/tắt nhạc">🔊</button>

<!-- Thanh công cụ -->
<div id="toolbar" class="hidden">
  <button class="tool" data-tool="hoe" title="Cuốc (1)">⛏️</button>
  <button class="tool" data-tool="seeds" title="Gieo hạt (2)">🌱</button>
  <button class="tool" data-tool="water" title="Tưới nước (3)">💧</button>
  <button class="tool" data-tool="hand" title="Thu hoạch (4)">✋</button>
  <div id="seedpick">🥕 Cà rốt</div>
</div>

<!-- Điều khiển cảm ứng -->
<div id="touchUI" class="hidden">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="touchBtns">
    <button id="btnShop" class="tbtn small">🛒</button>
    <button id="btnSeed" class="tbtn small">🌱</button>
    <button id="btnTool" class="tbtn small">🔄</button>
    <button id="btnAct" class="tbtn big">✅</button>
  </div>
</div>

<div id="toast" class="hidden"></div>

<!-- Cửa hàng -->
<div id="shopModal" class="modal hidden">
  <div class="panel">
    <h2>🛒 Cửa hàng</h2>
    <div class="shop-coins">💰 <span id="shopCoins">0</span></div>
    <div id="shopList"></div>
    <button id="sellAll" class="primary">Bán hết nông sản (<span id="sellVal">0</span>💰)</button>
    <button id="shopClose" class="ghost">Đóng</button>
  </div>
</div>

<!-- Màn hình bắt đầu -->
<div id="startOverlay">
  <div class="panel start">
    <h1>🌾 Nông Trại<br>Sunnyside</h1>
    <p class="sub">Cuốc đất • Gieo hạt • Tưới nước • Thu hoạch<br>Một game nông trại thư giãn nho nhỏ</p>
    <div class="hairlabel">Chọn kiểu tóc:</div>
    <div id="hairPick"></div>
    <div class="row">
      <button id="btnNew" class="primary">🌱 Chơi mới</button>
      <button id="btnContinue" class="ghost hidden">▶ Tiếp tục</button>
    </div>
    <p class="hint">⌨️ WASD/di chuyển • Space: dùng công cụ • 1-4: đổi công cụ • Q: đổi hạt giống<br>📱 Trên điện thoại có phím ảo bên dưới</p>
  </div>
</div>

<div id="loading" class="hidden">Đang tải assets…</div>

<script src="js/sunny-data.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
